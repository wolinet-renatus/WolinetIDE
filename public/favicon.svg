<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="wolinet-bg" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="45%" stop-color="#0066F5"/>
      <stop offset="100%" stop-color="#0047B3"/>
    </linearGradient>
    <linearGradient id="wolinet-rim" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#60A5FA" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="wolinet-hex" x1="120" y1="80" x2="392" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="wolinet-accent" x1="180" y1="160" x2="332" y2="352" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0047B3" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#002D72" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Squircle with 3D Bevel -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#wolinet-bg)" filter="url(#glow)"/>
  <rect x="34" y="34" width="444" height="444" rx="110" stroke="url(#wolinet-rim)" stroke-width="4"/>

  <!-- Subtle grid / tech mesh lines in background matching screenshot -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-width="1.5">
    <line x1="80" y1="160" x2="432" y2="160"/>
    <line x1="80" y1="256" x2="432" y2="256"/>
    <line x1="80" y1="352" x2="432" y2="352"/>
    <line x1="160" y1="80" x2="160" y2="432"/>
    <line x1="256" y1="80" x2="256" y2="432"/>
    <line x1="352" y1="80" x2="352" y2="432"/>
  </g>

  <!-- Hexagonal Shield Outer (inspired by screenshot badge) -->
  <path d="M256 96 L376 165.28 L376 303.84 L256 373.12 L136 303.84 L136 165.28 Z" 
        stroke="url(#wolinet-hex)" stroke-width="14" stroke-linejoin="round" fill="none" opacity="0.95"/>
  
  <path d="M256 122 L354 178.56 L354 291.68 L256 348.24 L158 291.68 L158 178.56 Z" 
        stroke="#60A5FA" stroke-width="3" stroke-dasharray="6 6" stroke-linejoin="round" fill="none" opacity="0.6"/>

  <!-- Modern Geometric "W" monogram -->
  <!-- Left wing -->
  <path d="M172 192 L204 316 L234 316 L256 244 L224 244 L208 200 Z" fill="#FFFFFF"/>
  <!-- Right wing -->
  <path d="M340 192 L308 316 L278 316 L256 244 L288 244 L304 200 Z" fill="#FFFFFF"/>
  <!-- Center Chevron & Core -->
  <path d="M228 316 L256 220 L284 316 L256 340 Z" fill="url(#wolinet-hex)"/>
  
  <!-- Terminal cursor & status dot accents -->
  <circle cx="256" cy="180" r="10" fill="#38BDF8"/>
  <circle cx="390" cy="120" r="14" fill="#10B981" filter="url(#glow)"/>
</svg>
