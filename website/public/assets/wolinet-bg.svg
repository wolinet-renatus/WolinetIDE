<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" fill="none">
  <defs>
    <style>
      :root { color: #0066f5; }
      @media (prefers-color-scheme: dark) { :root { color: #38bdf8; } }
    </style>
    <linearGradient id="wolinet-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#0066f5" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="wolinet-grad-glow" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0066f5" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="wolinet-radial-core" cx="65%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0066f5" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#0052cc" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0066f5" stop-opacity="0"/>
    </radialGradient>
    <filter id="wolinet-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Neural Glow -->
  <circle cx="320" cy="320" r="220" fill="url(#wolinet-radial-core)"/>
  <circle cx="160" cy="540" r="140" fill="url(#wolinet-radial-core)" opacity="0.6"/>

  <!-- Cybernetic Grid Coordinate Lines -->
  <g stroke="currentColor" stroke-width="1" stroke-opacity="0.12" stroke-dasharray="3 6">
    <line x1="50" y1="50" x2="450" y2="50"/>
    <line x1="50" y1="150" x2="450" y2="150"/>
    <line x1="50" y1="250" x2="450" y2="250"/>
    <line x1="50" y1="350" x2="450" y2="350"/>
    <line x1="50" y1="450" x2="450" y2="450"/>
    <line x1="50" y1="550" x2="450" y2="550"/>
    <line x1="50" y1="650" x2="450" y2="650"/>

    <line x1="100" y1="20" x2="100" y2="680"/>
    <line x1="200" y1="20" x2="200" y2="680"/>
    <line x1="300" y1="20" x2="300" y2="680"/>
    <line x1="400" y1="20" x2="400" y2="680"/>
  </g>

  <!-- Quantum AI Orbital Rings -->
  <g stroke="currentColor" stroke-opacity="0.25">
    <!-- Outer Orbital Ring -->
    <circle cx="320" cy="320" r="160" stroke-width="1.5" stroke-dasharray="14 10 2 10"/>
    <!-- Middle Orbital Ring -->
    <circle cx="320" cy="320" r="110" stroke-width="1" stroke-dasharray="6 6"/>
    <!-- Inner High-Frequency Ring -->
    <circle cx="320" cy="320" r="70" stroke-width="1.5" stroke-dasharray="2 4"/>
  </g>

  <!-- Diagonal Tech Vector Rails -->
  <g stroke="currentColor" stroke-width="1.5" stroke-opacity="0.3" stroke-linecap="round">
    <path d="M480 80 L380 180 L380 280 L460 360 L460 520 L400 580 L400 680"/>
    <path d="M440 40 L340 140 L340 220 L420 300 L420 460 L360 520 L360 640" stroke-dasharray="8 6"/>
    <path d="M220 80 L300 160 L300 240 L200 340 L200 480 L140 540 L140 660"/>
    <path d="M120 180 L180 240 L180 380 L80 480 L80 620" stroke-dasharray="4 8"/>
  </g>

  <!-- Isometric Hexagonal Lattice -->
  <g stroke="currentColor" stroke-width="1.2" stroke-opacity="0.35" fill="none">
    <!-- Top-Right Hex Node Cluster -->
    <polygon points="320,180 355,200 355,240 320,260 285,240 285,200"/>
    <polygon points="390,220 425,240 425,280 390,300 355,280 355,240"/>
    <polygon points="320,260 355,280 355,320 320,340 285,320 285,280"/>
    <polygon points="250,220 285,240 285,280 250,300 215,280 215,240"/>
    <polygon points="320,340 355,360 355,400 320,420 285,400 285,360"/>
    <polygon points="390,380 425,400 425,440 390,460 355,440 355,400"/>
    <polygon points="250,380 285,400 285,440 250,460 215,440 215,400"/>

    <!-- Bottom Left Cluster -->
    <polygon points="160,440 190,457 190,492 160,510 130,492 130,457" stroke-opacity="0.25"/>
    <polygon points="100,475 130,492 130,527 100,545 70,527 70,492" stroke-opacity="0.25"/>
    <polygon points="160,510 190,527 190,562 160,580 130,562 130,527" stroke-opacity="0.25"/>
  </g>

  <!-- Neural Constellation Circuit Lines & Data Nodes -->
  <g stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <!-- Pathways -->
    <path d="M285 200 L215 160 L140 160 L100 200 L100 300 L160 360" stroke-opacity="0.4"/>
    <path d="M355 200 L420 160 L480 160" stroke-opacity="0.4"/>
    <path d="M425 280 L480 310 L480 420" stroke-opacity="0.4"/>
    <path d="M355 400 L420 440 L420 540 L360 600" stroke-opacity="0.4"/>
    <path d="M250 460 L190 492 L190 600" stroke-opacity="0.4"/>

    <!-- Pulse Nodes (Outer glow circles) -->
    <circle cx="285" cy="200" r="4" fill="currentColor" fill-opacity="0.7"/>
    <circle cx="355" cy="200" r="4" fill="currentColor" fill-opacity="0.7"/>
    <circle cx="390" cy="220" r="5" fill="currentColor" fill-opacity="0.85"/>
    <circle cx="250" cy="220" r="5" fill="currentColor" fill-opacity="0.85"/>
    <circle cx="425" cy="280" r="4" fill="currentColor" fill-opacity="0.7"/>
    <circle cx="215" cy="280" r="4" fill="currentColor" fill-opacity="0.7"/>
    <circle cx="320" cy="340" r="6" fill="currentColor" fill-opacity="0.9"/>
    <circle cx="355" cy="400" r="4" fill="currentColor" fill-opacity="0.7"/>
    <circle cx="285" cy="400" r="4" fill="currentColor" fill-opacity="0.7"/>
    <circle cx="390" cy="380" r="5" fill="currentColor" fill-opacity="0.85"/>
    <circle cx="250" cy="380" r="5" fill="currentColor" fill-opacity="0.85"/>

    <circle cx="215" cy="160" r="3.5" fill="currentColor" fill-opacity="0.6"/>
    <circle cx="100" cy="200" r="3.5" fill="currentColor" fill-opacity="0.6"/>
    <circle cx="420" cy="160" r="3.5" fill="currentColor" fill-opacity="0.6"/>
    <circle cx="480" cy="310" r="3.5" fill="currentColor" fill-opacity="0.6"/>
    <circle cx="420" cy="540" r="3.5" fill="currentColor" fill-opacity="0.6"/>
    <circle cx="160" cy="510" r="4" fill="currentColor" fill-opacity="0.6"/>
    <circle cx="100" cy="545" r="3.5" fill="currentColor" fill-opacity="0.6"/>
  </g>

  <!-- Grand Central Wolinet AI Insignia -->
  <g transform="translate(320, 320)">
    <!-- Outer Shield Halo -->
    <polygon points="0,-64 55.4,-32 55.4,32 0,64 -55.4,32 -55.4,-32"
             stroke="currentColor" stroke-width="2" stroke-opacity="0.5" fill="none"/>
    <!-- Core Faceted Hexagon -->
    <polygon points="0,-48 41.5,-24 41.5,24 0,48 -41.5,24 -41.5,-24"
             stroke="currentColor" stroke-width="2.5" stroke-opacity="0.8" fill="currentColor" fill-opacity="0.08"/>

    <!-- Central "W" Wolinet Neural Monogram -->
    <path d="M-24,-18 L-14,20 L-4,0 L4,0 L14,20 L24,-18"
          stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.95"/>

    <!-- Radiant Cardinal AI Nodes -->
    <circle cx="0" cy="-64" r="3.5" fill="currentColor"/>
    <circle cx="55.4" cy="-32" r="3.5" fill="currentColor"/>
    <circle cx="55.4" cy="32" r="3.5" fill="currentColor"/>
    <circle cx="0" cy="64" r="3.5" fill="currentColor"/>
    <circle cx="-55.4" cy="32" r="3.5" fill="currentColor"/>
    <circle cx="-55.4" cy="-32" r="3.5" fill="currentColor"/>
  </g>

  <!-- Technical Telemetry Typography & Corner Markers -->
  <g fill="currentColor" fill-opacity="0.4" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', 'JetBrains Mono', monospace" font-size="9" letter-spacing="1.5">
    <text x="50" y="60">WOLINET // AGENTIC NEURAL CORE</text>
    <text x="50" y="75" font-size="7.5" fill-opacity="0.25">SYS.LOC // 0x7E3A-CORE-A</text>
    <text x="360" y="650" text-anchor="end" font-size="8">LATENCY: 0.14ms · SYNAPSE OK</text>

    <!-- Corner Reticles -->
    <path d="M40 40 L60 40 M40 40 L40 60" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.4"/>
    <path d="M460 40 L440 40 M460 40 L460 60" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.4"/>
    <path d="M40 660 L60 660 M40 660 L40 640" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.4"/>
    <path d="M460 660 L440 660 M460 660 L460 640" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.4"/>
  </g>
</svg>
